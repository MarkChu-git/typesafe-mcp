# Required status checks: "CI", "platform (macos-latest)", "platform (windows-latest)"
# (plus "Conventional title" from pr-title.yml). Renaming a job breaks branch protection.
# Every gate is a package.json script, so `bun run verify` locally runs the same checks.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history

      # The Bun version comes from package.json "packageManager".
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      # typecheck, type-aware lint, unit tests, knip, single-file build, stdio smoke of dist/.
      # TYPESAFE_API_KEY is never set here, so tests/integration/ stays skipped.
      - name: Verify
        run: bun run verify

      - name: Pack the npm tarball and smoke-test the installed bin
        run: bun run release:pack "$RUNNER_TEMP/pack"

      - name: Scan the git history for secrets
        run: bun run scan secrets

  # This server runs over stdio on the user's own machine, so macOS and Windows are real targets.
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

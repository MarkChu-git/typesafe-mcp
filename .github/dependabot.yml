version: 2

updates:
  # Runtime deps + devDeps (oxlint, typescript, @types/bun, MCP client).
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps; majors still arrive separately.
      minor-patch:
        update-types:
          - minor
          - patch

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

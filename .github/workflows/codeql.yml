# Static analysis for the TypeScript sources. Public repo: free.
# Do NOT also enable "CodeQL default setup" in repo settings — having both
# causes duplicate analyses. This file is the (advanced) setup.
name: CodeQL

on:
  pull_request:
    paths:
      - "**/*.ts"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.ts"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly: new CodeQL queries ship even when this code doesn't change.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Empty repo (pre-scaffold main) has nothing to analyze; skip instead of
  # failing. Skipped jobs count as success for required checks anyway.
  detect:
    name: Detect sources
    runs-on: ubuntu-latest
    outputs:
      has-ts: ${{ steps.check.outputs.has-ts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if find . -name '*.ts' -not -path './node_modules/*' -print -quit | grep -q .; then
            echo "has-ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-ts=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze
    needs: detect
    if: needs.detect.outputs.has-ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none # interpreted language, no build step

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"

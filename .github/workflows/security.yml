# Supply-chain and workflow-file security. Advisory, not a required check: a newly disclosed
# advisory should not block unrelated PRs, but it fails loudly here and on the weekly run.
name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly: newly disclosed vulnerabilities can hit an unchanged bun.lock.
    - cron: "33 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # osv-scanner reads bun.lock directly (no install needed) and must account for every
      # package in it. Exceptions go in osv-scanner.toml, each with a written reason.
      - name: Audit bun.lock
        run: bun run scan deps

      # Gates the PR diff: no new vulnerable or flagged dependency can be added.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # reviewdog PR annotations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
        with:
          fail_level: error
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          config: .github/zizmor.yml
          min-severity: low
          # Inline annotations instead of SARIF so fork PRs work without
          # security-events permission.
          advanced-security: "false"
          annotations: "true"

schema: spec-driven

context: |
  Language: zh
  All artifacts must be written in zh.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: typesafe-mcp — MCP server wrapping TypeSafe AI's Jev System One model.
  Jev is a hosted decision model (not an LLM). It returns Choice / Score / Noul answers.
  Audience: every MCP host / agent (Cursor, Claude Desktop, Claude Code, Codex, Windsurf, Cline, custom). Not Cursor-only.
  First transport is stdio. Streamable HTTP is later (remote / shared).
  Stack: Bun, TypeScript, @typesafe-ai/sdk, @modelcontextprotocol/server v2, Zod, oxlint.
  Secrets: TYPESAFE_API_KEY via environment only. Never commit keys.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

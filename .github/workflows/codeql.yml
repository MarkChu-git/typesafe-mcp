# Static analysis for the TypeScript sources. Public repo: free.
# Do NOT also enable "CodeQL default setup" in repo settings — having both
# causes duplicate analyses. This file is the (advanced) setup.
name: CodeQL

on:
  pull_request:
    paths:
      - "**/*.ts"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.ts"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly: new CodeQL queries ship even when this code doesn't change.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none # interpreted language, no build step

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"

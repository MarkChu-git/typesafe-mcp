# Required status check name: "CI" (job name). Keep this in sync with
# branch protection / CONTRIBUTING.md.
# `platform` is advisory: promote `platform (macos-latest)` and
# `platform (windows-latest)` to required checks once green on main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Skip package checks until package.json exists
        if: hashFiles('package.json') == ''
        run: |
          echo "No package.json yet."
          echo "Checkout and Bun ${{ steps.setup-bun.outputs.bun-version }} succeeded."
          echo "Install, typecheck, and tests start once package.json is committed."

      - name: Require bun.lock when package.json exists
        if: hashFiles('package.json') != ''
        run: |
          if [ ! -f bun.lock ] && [ ! -f bun.lockb ]; then
            echo "::error::package.json is present but bun.lock is missing. Commit the Bun lockfile so CI can run bun install --frozen-lockfile."
            exit 1
          fi

      - name: Install
        if: hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: bunx tsc --noEmit

      - name: Lint
        if: hashFiles('.oxlintrc.json') != '' && (hashFiles('src/**/*.ts') != '' || hashFiles('tests/**/*.ts') != '')
        run: bunx oxlint

      - name: Test
        if: hashFiles('package.json') != ''
        run: bun test --pass-with-no-tests --path-ignore-patterns='**/integration/**'
        # Do not set TYPESAFE_API_KEY. Live tests under tests/integration/ stay skipped.

  # This server runs over stdio on the user's own machine, so macOS/Windows
  # are real targets. Advisory until proven green; see header comment.
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        if: hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: bunx tsc --noEmit

      - name: Lint
        if: hashFiles('.oxlintrc.json') != '' && (hashFiles('src/**/*.ts') != '' || hashFiles('tests/**/*.ts') != '')
        run: bunx oxlint

      - name: Test
        if: hashFiles('package.json') != ''
        run: bun test --pass-with-no-tests --path-ignore-patterns='**/integration/**'

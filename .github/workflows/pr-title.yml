# Enforces Conventional Commits on PR titles. With squash-merge, the PR
# title becomes the commit on main — this is what keeps main's history clean.
# "Conventional title" is a required check on main.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title (statuses: write is only for the unused WIP mode)
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md "Commit messages".
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
            revert
          requireScope: false
